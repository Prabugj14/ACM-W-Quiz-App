<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACM-W Quiz Challenge</title>
    <style>
        /* --- CSS STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Welcome Screen */
        .header-bar {
            height: 10px;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            border-radius: 5px;
            margin-bottom: 30px;
        }

        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
        }

        .features {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 40px;
        }

        .feature-box {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            flex: 1;
        }

        .feature-box h3 {
            color: #6a11cb;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .feature-box p {
            color: #718096;
            font-size: 0.9em;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary {
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }

        .btn-primary:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Quiz Screen */
        .quiz-header {
            margin-bottom: 30px;
        }

        .progress-text {
            text-align: center;
            color: #4a5568;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.4em;
            color: #2d3748;
            margin-bottom: 30px;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            color: #2d3748;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #6a11cb;
            background: #f7fafc;
        }

        .option-btn.selected {
            background: #6a11cb;
            color: white;
            border-color: #6a11cb;
        }

        .option-btn.correct {
            background: #48bb78;
            color: white;
            border-color: #48bb78;
        }

        .option-btn.incorrect {
            background: #f56565;
            color: white;
            border-color: #f56565;
        }

        /* Result Screen */
        .score-card {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .score-number {
            font-size: 4em;
            font-weight: bold;
            margin: 10px 0;
        }

        .score-message {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .result-details {
            margin-bottom: 30px;
        }

        .result-item {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #f7fafc;
        }

        .result-item.correct { border-left: 5px solid #48bb78; }
        .result-item.incorrect { border-left: 5px solid #f56565; }

        .result-item p { margin: 5px 0; color: #4a5568; }
        .result-item strong { color: #2d3748; }

        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
            .features { flex-direction: column; }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="screen active">
            <div class="header-bar"></div>
            <h1>ACM-W Quiz Challenge</h1>
            <div class="features">
                <div class="feature-box">
                    <h3>10</h3>
                    <p>Questions</p>
                </div>
                <div class="feature-box">
                    <h3>MCQ</h3>
                    <p>Multiple Choice</p>
                </div>
                <div class="feature-box">
                    <h3>Score</h3>
                    <p>& Results</p>
                </div>
            </div>
            <button class="btn btn-primary" onclick="startQuiz()">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <div class="progress-text" id="progress-text">Question 1 of 10</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>
            <h2 class="question-text" id="question-text">Question goes here?</h2>
            <div class="options-grid" id="options-container">
                <!-- Options injected by JS -->
            </div>
            <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" disabled>Next Question</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <div class="score-card">
                <h2>Quiz Completed!</h2>
                <div class="score-number" id="final-score">0/10</div>
                <p class="score-message" id="score-message">Good job!</p>
            </div>
            <div class="result-details" id="result-details">
                <!-- Details injected by JS -->
            </div>
            <button class="btn btn-primary" onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */
        const questions = [
            { q: "What does ACM stand for?", options: ["Association for Computing Machinery", "Advanced Computer Management", "Automated Code Machine", "Application Control Module"], a: 0 },
            { q: "What is the primary focus of ACM-W?", options: ["Supporting women in computing", "Developing hardware", "Managing networks", "Creating video games"], a: 0 },
            { q: "What does AI stand for?", options: ["Automated Intelligence", "Artificial Intelligence", "Advanced Integration", "Application Interface"], a: 1 },
            { q: "Which of these is a type of Machine Learning?", options: ["Supervised Learning", "Controlled Learning", "Directed Learning", "Managed Learning"], a: 0 },
            { q: "What is a neural network?", options: ["A computer network", "A brain-inspired computing model", "An internet protocol", "A database system"], a: 1 },
            { q: "In what year was ACM founded?", options: ["1947", "1950", "1945", "1952"], a: 0 },
            { q: "What is Deep Learning?", options: ["Reading complex books", "A subset of ML using neural networks", "Studying computer science", "Advanced programming"], a: 1 },
            { q: "Which language is most popular for AI development?", options: ["Python", "HTML", "CSS", "SQL"], a: 0 },
            { q: "What does NLP stand for in AI?", options: ["Natural Language Processing", "Network Layer Protocol", "New Logic Programming", "Node Link Process"], a: 0 },
            { q: "What does the 'W' in ACM-W represent?", options: ["World", "Women", "Web", "Work"], a: 1 }
        ];

        let currentQ = 0;
        let score = 0;
        let selectedOption = null;
        let userAnswers = [];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startQuiz() {
            currentQ = 0;
            score = 0;
            userAnswers = [];
            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQ];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress-text').innerText = `Question ${currentQ + 1} of ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQ) / questions.length) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            selectedOption = null;
            document.getElementById('next-btn').disabled = true;

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${String.fromCharCode(65 + index)}. ${opt}`;
                btn.onclick = () => selectOption(index, btn);
                container.appendChild(btn);
            });
        }

        function selectOption(index, btn) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedOption = index;
            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            const q = questions[currentQ];
            const isCorrect = selectedOption === q.a;
            if (isCorrect) score++;

            userAnswers.push({ q: q.q, selected: q.options[selectedOption], correct: q.options[q.a], isCorrect });

            const btns = document.querySelectorAll('.option-btn');
            btns[selectedOption].classList.add(isCorrect ? 'correct' : 'incorrect');
            if (!isCorrect) btns[q.a].classList.add('correct');

            setTimeout(() => {
                currentQ++;
                if (currentQ < questions.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1000);
        }

        function showResults() {
            showScreen('result-screen');
            document.getElementById('final-score').innerText = `${score}/${questions.length}`;
            
            let msg = "Keep studying and try again!";
            if (score >= 8) msg = "Excellent! You're an ACM-W expert!";
            else if (score >= 6) msg = "Good job! Keep learning!";
            document.getElementById('score-message').innerText = msg;

            const details = document.getElementById('result-details');
            details.innerHTML = '<h3>Review Your Answers:</h3>';
            userAnswers.forEach((ans, i) => {
                const div = document.createElement('div');
                div.className = `result-item ${ans.isCorrect ? 'correct' : 'incorrect'}`;
                div.innerHTML = `
                    <p><strong>Q${i+1}:</strong> ${ans.q}</p>
                    <p>Your Answer: ${ans.selected} ${ans.isCorrect ? '✅' : '❌'}</p>
                    ${!ans.isCorrect ? `<p>Correct Answer: ${ans.correct}</p>` : ''}
                `;
                details.appendChild(div);
            });
        }

        function restartQuiz() {
            startQuiz();
        }
    </script>
</body>
</html>
